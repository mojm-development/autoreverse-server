{#- legacy CoverTile.svelte for a book (`book: BookRow`). The play and pick buttons join with
    playback and bulk editing. -#}
<figure class="cover-tile">
	<div class="art">
		{% if book.has_cover %}
		<img src="/items/{{ book.id }}/cover" alt="" width="100" height="100" />
		{% else %}
		<div class="placeholder" style="--accent: var(--book)"></div>
		{% endif %}
		{% if book.percent > 0 %}
		<span class="progress" aria-hidden="true">
			<span class="progress-fill" style="width: {{ book.percent }}%"></span>
		</span>
		{% endif %}
	</div>
	<figcaption>
		<span class="title">{{ book.title }}</span>
		<span class="subtitle">{{ book.author }}</span>
	</figcaption>
</figure>
