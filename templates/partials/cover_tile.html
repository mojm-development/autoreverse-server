{#- legacy CoverTile.svelte for a book (`book: BookRow`), with its play button. The pick button
    joins with bulk editing. -#}
{% import "partials/ui.html" as ui %}
<figure class="cover-tile">
	<div class="art">
		{% if book.has_cover %}
		<img src="/items/{{ book.id }}/cover" alt="" width="100" height="100" />
		{% else %}
		<div class="placeholder" style="--accent: var(--book)"></div>
		{% endif %}
		{% if book.percent > 0 %}
		<span class="progress" aria-hidden="true">
			<span class="progress-fill" style="width: {{ book.percent }}%"></span>
		</span>
		{% endif %}
		<button class="play" aria-label="Abspielen" title="Abspielen" data-action="play" data-item-id="{{ book.id }}">{% call ui::icon("play-filled") %}{% endcall %}</button>
	</div>
	<figcaption>
		<span class="title">{{ book.title }}</span>
		<span class="subtitle">{{ book.author }}</span>
	</figcaption>
</figure>
