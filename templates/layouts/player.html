{#- Every logged-in page: the swappable page plus the web player that outlives it (legacy root
    +layout.svelte with MiniPlayerBar). Links and forms are boosted by htmx; static/js/player/
    navigation.js swaps only `#page`, so the `<audio>` element and the mini bar below keep playing
    across page changes, the way SvelteKit's client-side navigation did. Needs `shell: Shell`. -#}
{% extends "base.html" %}
{% block layout_head %}
		{#- All page styles and page scripts up front: a boosted navigation swaps the body only,
		    the head of the next page is never read. -#}
		<link rel="stylesheet" href="{{ crate::web::assets::prefix() }}/css/player.css" />
		<link rel="stylesheet" href="{{ crate::web::assets::prefix() }}/css/pages/library.css" />
		<link rel="stylesheet" href="{{ crate::web::assets::prefix() }}/css/pages/books.css" />
		<link rel="stylesheet" href="{{ crate::web::assets::prefix() }}/css/pages/book.css" />
		<link rel="stylesheet" href="{{ crate::web::assets::prefix() }}/css/pages/series.css" />
		<link rel="stylesheet" href="{{ crate::web::assets::prefix() }}/css/pages/albums.css" />
		<link rel="stylesheet" href="{{ crate::web::assets::prefix() }}/css/pages/album.css" />
		<link rel="stylesheet" href="{{ crate::web::assets::prefix() }}/css/pages/artists.css" />
		<link rel="stylesheet" href="{{ crate::web::assets::prefix() }}/css/pages/artist.css" />
		<link rel="stylesheet" href="{{ crate::web::assets::prefix() }}/css/pages/settings.css" />
		<link rel="stylesheet" href="{{ crate::web::assets::prefix() }}/css/pages/now-playing.css" />
		<link rel="stylesheet" href="{{ crate::web::assets::prefix() }}/css/pages/favorites.css" />
		<link rel="stylesheet" href="{{ crate::web::assets::prefix() }}/css/pages/search.css" />
		<link rel="stylesheet" href="{{ crate::web::assets::prefix() }}/css/pages/playlists.css" />
		<link rel="stylesheet" href="{{ crate::web::assets::prefix() }}/css/pages/podcasts.css" />
		<link rel="stylesheet" href="{{ crate::web::assets::prefix() }}/css/editors.css" />
		<link rel="stylesheet" href="{{ crate::web::assets::prefix() }}/css/pages/error.css" />
		<script src="{{ crate::web::assets::prefix() }}/js/books.js" defer></script>
		<script src="{{ crate::web::assets::prefix() }}/js/artists.js" defer></script>
		<script src="{{ crate::web::assets::prefix() }}/js/series.js" defer></script>
		<script src="{{ crate::web::assets::prefix() }}/js/playlists.js" defer></script>
		<script src="{{ crate::web::assets::prefix() }}/js/podcasts.js" defer></script>
		<script type="module" src="{{ crate::web::assets::prefix() }}/js/player/main.js"></script>
		<script type="module" src="{{ crate::web::assets::prefix() }}/js/metadata/editor.js"></script>
		<script type="module" src="{{ crate::web::assets::prefix() }}/js/pages.js"></script>
{% endblock %}
{% block body %}
<div class="boost-root" hx-boost="true">
	<div
		id="page"
		hx-history-elt
		data-speed="{{ shell.preferences.playback_speed }}"
		data-skip-back="{{ shell.preferences.skip_back }}"
		data-skip-forward="{{ shell.preferences.skip_forward }}"
	>
		{% block page %}{% endblock %}
	</div>
	{% include "partials/mini_player.html" %}
</div>
{% endblock %}
