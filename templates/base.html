<!doctype html>
<html lang="de">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<script>
			// Runs before anything is painted: a stored choice (see static/js/app.js) takes effect
			// immediately, otherwise it stays with prefers-color-scheme (see tokens.css) — without
			// this early script there would be a brief flash of the wrong theme on load.
			(function () {
				try {
					var stored = localStorage.getItem('autoreverse-theme');
					if (stored === 'light' || stored === 'dark') {
						document.documentElement.setAttribute('data-theme', stored);
					}
				} catch (error) {
					// e.g. private mode with no localStorage — falls back to the system theme.
				}
			})();
		</script>
		<title>{% block title %}Autoreverse{% endblock %}</title>
		<link rel="icon" href="/favicon.png" sizes="any" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<link rel="stylesheet" href="/css/app.css" />
		<link rel="stylesheet" href="/css/components.css" />
		{% block layout_head %}{% endblock %}
		{% block head %}{% endblock %}
		<script src="/js/htmx-2.0.4.min.js" defer></script>
		<script src="/js/app.js" defer></script>
	</head>
	<body>
		{% include "partials/icon_sprite.html" %}
		{% block body %}{% endblock %}
	</body>
</html>
