# Builds and publishes the Docker image to GHCR. Runs on the GitHub push mirror —
# the canonical repo lives on our own GitLab, but mirrored pushes trigger this
# like any other push.
name: Docker image

on:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # QEMU only runs the runtime stage's apt-get for arm64. The Rust build stage is pinned to
      # $BUILDPLATFORM and cross-compiles, so rustc never runs emulated.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # mode=max also keeps the dependency layer of the build stage, so a push that only
          # touches src/ skips recompiling the crates.
          cache-from: type=gha
          cache-to: type=gha,mode=max
