services:
  postgres:
    image: postgres:16
    restart: always
    ports:
      - '5433:5432'
    environment:
      POSTGRES_USER: capstan
      POSTGRES_PASSWORD: capstan
      POSTGRES_DB: capstan
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U capstan']
      interval: 2s
      timeout: 3s
      retries: 10

  capstan-next:
    build: .
    ports:
      - '8180:3000'
    environment:
      DATABASE_URL: postgresql://capstan:capstan@postgres:5432/capstan
      CAPSTAN_BOOKS: /library/books
      CAPSTAN_MUSIC: /library/music
      CAPSTAN_DATA: /data
    volumes:
      - ${CAPSTAN_BOOKS_HOST:-./dev-library/books}:/library/books:ro
      - ${CAPSTAN_MUSIC_HOST:-./dev-library/music}:/library/music:ro
      - capstan-data:/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3000/login']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  capstan-data:
